name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint:types
      - run: npm run test:unit
      - run: npm run test:content
      # TEMPORARY: `build:draft` tolerates REPLACE placeholders until the owner completes
      # content/WORKSHEET.md. Switch back to `npm run build` (strict) once content is published.
      - run: npm run build:draft
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: lighthouse-and-playwright
          path: |
            .lighthouseci
            playwright-report
          retention-days: 14

  # Gated on the test job: Pages is only deployed once the build and the full test suite
  # above have passed on a push to main. Requires Pages to be enabled on the repository
  # (Settings → Pages → Source: GitHub Actions); on a free plan that needs a public repo.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          # TEMPORARY, matches the test job above; remove once content is published.
          ALLOW_PLACEHOLDERS: '1'
      - id: deployment
        uses: actions/deploy-pages@v5
